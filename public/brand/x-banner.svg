<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <rect width="1500" height="500" fill="#ffffff"/>

  <!-- The wordmark sits well right of centre-left: X overlays the avatar at the
       bottom-left of a header, and anything under roughly x=300 is covered. -->
  
    <text x="300" y="248" fill="#000000" font-family="M42_FLIGHT 721" letter-spacing="3">
      <tspan font-size="57">X</tspan><tspan font-size="100">NFT</tspan><tspan font-size="57">S</tspan>
    </text>

  <text x="304" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="27"
        font-weight="700" letter-spacing="2.4" fill="#000000">POWERED BY XSTOCKS</text>

  <text x="304" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#5f5f5f">
    You don't buy a token. You hire an employee.
  </text>

  <!-- Vertical rule then the tape, echoing the header divider on the site. -->
  <rect x="1010" y="150" width="2" height="200" fill="#000000" opacity="0.18"/>

  
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="1070" y="178" font-size="26" fill="#000000" font-weight="700">$NVDAx</text>
      <text x="1260" y="178" font-size="26" fill="#000000" text-anchor="end">$205.76</text>
      <text x="1390" y="178" font-size="24" fill="#157f3a" text-anchor="end">▲ 1.84%</text>
    </g>
  
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="1070" y="226" font-size="26" fill="#000000" font-weight="700">$AAPLx</text>
      <text x="1260" y="226" font-size="26" fill="#000000" text-anchor="end">$302.61</text>
      <text x="1390" y="226" font-size="24" fill="#157f3a" text-anchor="end">▲ 0.42%</text>
    </g>
  
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="1070" y="274" font-size="26" fill="#000000" font-weight="700">$MSFTx</text>
      <text x="1260" y="274" font-size="26" fill="#000000" text-anchor="end">$481.07</text>
      <text x="1390" y="274" font-size="24" fill="#dc2626" text-anchor="end">▼ 0.63%</text>
    </g>
  
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="1070" y="322" font-size="26" fill="#000000" font-weight="700">$SPYx</text>
      <text x="1260" y="322" font-size="26" fill="#000000" text-anchor="end">$771.84</text>
      <text x="1390" y="322" font-size="24" fill="#157f3a" text-anchor="end">▲ 0.16%</text>
    </g>

  <rect x="0" y="488" width="375" height="12" fill="#44af63"/><rect x="375" y="488" width="375" height="12" fill="#1d84de"/><rect x="750" y="488" width="375" height="12" fill="#d211b0"/><rect x="1125" y="488" width="375" height="12" fill="#ff1b1b"/>
</svg>